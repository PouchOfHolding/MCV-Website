spring.application.name=mcv

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=true
spring.datasource.url=jdbc:postgresql://${POSTGRES_DB_IP}:${POSTGRES_DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

mcv.api.allowed_origin=${ALLOWED_ORIGIN}

mcv.api.jwtSecret=${JWT_SECRET}
# 5 minutes for access token
mcv.api.jwtAccessExpirationMs=300000
# 7 days for refresh token
mcv.api.jwtRefreshExpirationMs=604800000

springdoc.api-docs.path=/api/docs

springdoc.swagger-ui.path=/api/swagger-ui

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

management.endpoints.web.exposure.include=health

management.endpoints.web.base-path=/api

file.upload-dir=uploads

mcv.admin.email=${APP_ADMIN_EMAIL}
mcv.admin.password=${APP_ADMIN_PASSWORD}

server.forward-headers-strategy=framework